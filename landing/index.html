  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"1d7f5732-8892-45ee-9f53-14b1f0540dee\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"f78f0eb0-5bce-4313-999e-de8e2cd5d500\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"cf33c6f4-dede-4634-bd43-6be52ded0ad2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"a5f7ac46-d660-49d1-ba79-9f83ef23d65c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n/* v2 — design-elevation pass. Ground: soft neutral, one accent (brand indigo), spark only as a signal.\n   Spacing: 8/16/24/32/48/64/96/128. Radius: 12 controls, 20 cards, 28 feature blocks. */\nbody{margin:0;background:#FAFAFC;color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}\na{color:var(--brand)}a:hover{color:var(--brand-hover)}\n*:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}\n.n2{overflow-x:clip;--ground:#FAFAFC;--card:#FFFFFF;--line:#E7E7F0;--soft:#F1F1F7;--muted:#56566E;--glow:0 24px 48px -12px rgba(43,43,217,0.18)}\n.wrap{box-sizing:border-box;width:100%;max-width:1232px;margin:0 auto;padding-inline:32px}\n\n/* nav */\n.soon-bar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;min-height:40px;padding:8px 16px;background:var(--ink);color:#FFFFFF;font-size:14px;font-weight:600;text-align:center}\n.soon-bar b{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--spark);color:var(--ink);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}\n.soon-bar a{color:#FFFFFF;font-weight:800}\n.soon-tag{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);vertical-align:middle;margin-left:8px}\n.nav{position:sticky;top:0;z-index:20;background:rgba(250,250,252,0.82);backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid transparent;transition:border-color 200ms}\n.nav-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;min-height:72px;padding-block:12px;box-sizing:border-box}\n.nav-links{display:flex;gap:4px;flex:1;justify-content:center}\n.nav-links a{display:inline-flex;align-items:center;flex:none;white-space:nowrap;min-height:44px;padding:0 14px;border-radius:999px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:700;transition:background 150ms}\n.nav-links a:hover{background:var(--soft);color:var(--ink)}\n.nav-row>a:first-child{flex:none;display:inline-flex}\n.nav-right{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}\n.nav-text{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:700}\n.nav-text:hover{color:var(--brand)}\n\n/* primary action button (custom so we can add arrow motion) */\n.cta{box-sizing:border-box;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 24px;border:0;border-radius:14px;background:var(--brand);color:#FFFFFF;font:800 16px var(--font-sans);cursor:pointer;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,0.25) inset,0 10px 24px -8px rgba(43,43,217,0.55);transition:transform 180ms cubic-bezier(.2,.8,.2,1),box-shadow 180ms,background 150ms}\n.cta:hover{background:var(--brand-hover);transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,0.25) inset,0 16px 32px -10px rgba(43,43,217,0.6)}\n.cta:active{transform:translateY(0)}\n.cta svg{transition:transform 180ms cubic-bezier(.2,.8,.2,1)}\n.cta:hover svg{transform:translateX(4px)}\n.cta--light{background:#FFFFFF;color:var(--brand);box-shadow:0 10px 24px -8px rgba(11,11,26,0.35)}\n.cta--light:hover{background:#F0F0FF;color:var(--brand)}\n.cta--sm{min-height:44px;padding:0 18px;font-size:15px;border-radius:12px}\n\n/* hero */\n.hero{position:relative;padding:72px 0 64px}\n.hero::before{content:\"\";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,#DCDCE8 1px,transparent 0);background-size:32px 32px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 30% 40%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 70% 60% at 30% 40%,#000 30%,transparent 80%);pointer-events:none}\n.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,0.92fr);gap:64px;align-items:center}\n.eng-strip{display:flex;flex-wrap:wrap;gap:8px}\n.eng-pill{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:800 13px var(--font-sans);color:var(--muted);cursor:pointer;transition:border-color 300ms,color 300ms,transform 300ms cubic-bezier(.2,.8,.2,1),box-shadow 300ms}\n.eng-pill:hover{border-color:var(--ink);color:var(--ink)}\n.eng-pill--on{border-color:var(--ink);color:var(--ink);transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(11,11,26,0.25)}\n.eng-logo{width:18px;height:18px;object-fit:contain;flex:none;border-radius:4px;filter:grayscale(1);opacity:0.5;transition:filter 300ms,opacity 300ms}\n.eng-pill--on .eng-logo{filter:none;opacity:1}\n.h-big{margin:0;font-size:88px;line-height:0.96;font-weight:800;letter-spacing:-0.055em;color:var(--ink)}\n.rot{display:inline-block;position:relative;vertical-align:bottom;perspective:1100px;perspective-origin:30% 50%}\n.rot-ghost{display:inline-block;visibility:hidden}\n.prism{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 950ms cubic-bezier(.7,0,.2,1)}\n.prism>span{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;backface-visibility:hidden;-webkit-backface-visibility:hidden;opacity:0.3;transition:opacity 950ms}\n.prism>span.on{opacity:1}\n.prism>span.w-chatgpt{color:#10A37F}\n.prism>span.w-claude{color:#D97757}\n.prism>span.w-perplexity{color:#20808D}\n.prism>span.w-gemini{color:#4285F4;background-image:linear-gradient(90deg,#4285F4 0%,#9B72CB 55%,#D96570 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}\n.strike{position:relative;white-space:nowrap}\n.strike svg{position:absolute;left:-2%;bottom:-0.1em;width:104%;height:0.3em;overflow:visible}\n.strike path{stroke:var(--spark);stroke-width:7;fill:none;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 900ms 700ms cubic-bezier(.6,0,.2,1) forwards}\n@keyframes draw{to{stroke-dashoffset:0}}\n.sub{margin:0;max-width:34ch;font-size:20px;line-height:30px;font-weight:500;color:var(--muted)}\n.sub strong{color:var(--ink);font-weight:700}\n\n.field{box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--glow);max-width:560px;transition:border-color 200ms,box-shadow 200ms}\n.field:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(43,43,217,0.12),var(--glow)}\n.field label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}\n.field-pre{padding-left:12px;font:500 17px var(--font-mono);color:var(--muted)}\n.field input{flex:1 1 180px;min-width:0;min-height:56px;border:0;outline:0;background:transparent;font:600 18px var(--font-sans);color:var(--ink)}\n.field input::placeholder{color:#9A9AB0}\n.fine{display:flex;flex-wrap:wrap;gap:16px;margin:0;font-size:14px;font-weight:600;color:var(--muted)}\n.fine span{display:inline-flex;align-items:center;gap:6px}\n.fine svg{color:var(--success)}\n\n/* answer card (no product UI: this is what an AI assistant shows) */\n.answer{position:relative;background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 40px 80px -24px rgba(11,11,26,0.18),0 2px 6px rgba(11,11,26,0.04);padding:24px;display:flex;flex-direction:column;gap:16px;min-height:440px;box-sizing:border-box}\n.a-top{display:flex;align-items:center;justify-content:space-between;gap:12px}\n.a-eng{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:800}\n.a-eng img{width:22px;height:22px;object-fit:contain;border-radius:5px}\n.a-tag{font:500 12px var(--font-mono);color:var(--muted);padding:6px 10px;border-radius:999px;background:var(--soft)}\n.a-q{align-self:flex-end;max-width:88%;background:var(--ink);color:#FFFFFF;border-radius:20px 20px 6px 20px;padding:14px 18px;font-size:15px;line-height:22px;font-weight:700;min-height:22px}\n.caret{display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-0.15em;background:var(--spark);animation:blink 1s steps(1) infinite}\n@keyframes blink{50%{opacity:0}}\n.a-intro{font-size:14px;font-weight:700;color:var(--muted);opacity:0;transition:opacity 300ms}\n.a-intro.on{opacity:1}\n.a-list{display:flex;flex-direction:column;gap:8px}\n.a-item{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--soft);opacity:0;transform:translateY(10px);transition:opacity 340ms,transform 420ms cubic-bezier(.2,.8,.2,1)}\n.a-item.on{opacity:1;transform:none}\n.a-item b{width:32px;height:32px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}\n.a-item span{font-size:15px;line-height:20px;font-weight:500;color:var(--muted)}\n.a-item strong{color:var(--ink);font-weight:800}\n.a-miss{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1.5px dashed var(--danger);background:var(--danger-soft);color:var(--danger);font-size:15px;font-weight:800;opacity:0;transform:translateY(8px);transition:opacity 300ms,transform 300ms}\n.a-miss.on{opacity:1;transform:none;animation:nudge 520ms 200ms}\n@keyframes nudge{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}\n.a-score{position:absolute;right:-20px;bottom:-24px;display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:0 20px 40px -12px rgba(11,11,26,0.22);opacity:0;transform:translateY(16px) rotate(-2deg);transition:opacity 360ms,transform 520ms cubic-bezier(.2,.8,.2,1)}\n.a-score.on{opacity:1;transform:rotate(-2deg)}\n.a-score circle.arc{transition:stroke-dashoffset 900ms cubic-bezier(.2,.8,.2,1)}\n.mono{font-family:var(--font-mono);font-size:12px;color:var(--muted)}\n\n/* marquee */\n.mq-wrap{padding:32px 0 28px;display:flex;flex-direction:column;gap:12px;background:#EEEEF7;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}\n.mq-rows{display:flex;flex-direction:column;gap:12px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}\ ro: 'Küçük şirketlerle çalışan firmalar:', score: 9,\n    items: [{ b: 'Marka A', d: 'sabit aylık ücret' }, { b: 'Marka B', d: 'kuruluş danışmanlığı' }, { b: 'Marka C', d: 'online belge takibi' }] },\n  { name: 'Perplexity', logo: '/logos/perplexity.png', q: 'Yakınımda iyi bir güzellik merkezi var mı?', intro: 'Bölgende yüksek puanlı yerler:', score: 15,\n    items: [{ b: 'Marka A', d: 'cilt bakımı' }, { b: 'Marka B', d: 'online randevu' }, { b: 'Marka C', d: 'uzun çalışma saatleri' }] }\n];\nvar SECTORS = [\n  { label: 'Yazılım ve SaaS', q: 'Ekibim için en iyi proje yönetim aracı hangisi?', intro: 'Ekip büyüklüğüne göre öne çıkan üç seçenek var:', items: [{ b: 'Marka A', d: 'esnek panolar ve kolay kurulum.' }, { b: 'Marka B', d: 'büyük ekipler için güçlü raporlama.' }, { b: 'Marka C', d: 'uygun fiyatlı başlangıç planı.' }] },\n  { label: 'Sağlık ve klinikler', q: \"İstanbul'da güvenilir bir fizyoterapi merkezi hangisi?\", intro: 'Hasta yorumları ve uzman kadrosuyla öne çıkan merkezler:', items: [{ b: 'Marka A', d: 'spor yaralanmalarında uzman ekip.' }, { b: 'Marka B', d: 'iki şube ve kolay ulaşım.' }, { b: 'Marka C', d: 'hafta sonu randevu imkânı.' }] },\n  { label: 'Profesyonel hizmetler', q: 'Küçük bir şirket için iyi bir muhasebe ya da hukuk danışmanlığı önerir misin?', intro: 'Küçük şirketlerle çalışan, sık önerilen firmalar:', items: [{ b: 'Marka A', d: 'aylık sabit ücretli muhasebe paketi.' }, { b: 'Marka B', d: 'şirket kuruluşu ve sözleşme danışmanlığı.' }, { b: 'Marka C', d: 'online belge takibi.' }] },\n  { label: 'Yerel işletmeler', q: 'Yakınımda iyi bir güzellik merkezi var mı?', intro: 'Bulunduğun bölgede yüksek puanlı yerler:', items: [{ b: 'Marka A', d: 'cilt bakımında uzman.' }, { b: 'Marka B', d: 'online randevu sistemi.' }, { b: 'Marka C', d: 'uzun çalışma saatleri.' }] }\n];\nvar QS1 = ['En iyi CRM hangisi?', \"Kadıköy'de diş kliniği önerir misin?\", 'B2B için muhasebe yazılımı?', 'Güvenilir bir hukuk bürosu?', 'Startup için bulut sağlayıcı?', 'Yakınımda pilates stüdyosu?'];\nvar QS2 = ['İK yazılımlarını karşılaştır', 'En iyi e-ticaret altyapısı?', 'Kurumsal siber güvenlik firması?', 'Çocuğum için yüzme kursu?', 'ITSM danışmanı önerir misin?', 'Uygun fiyatlı web ajansı?'];\nvar CIRC = 138.2;\nvar LEGAL = {\"kvkk\": {\"title\": \"KVKK Bildirimi\", \"date\": \"[TARİH]\", \"sections\": [{\"h\": \"Metin yakında eklenecek\", \"ps\": [{\"t\": \"Bu sayfanın içeriği hazırlanıyor. Kişisel verilerinizle ilgili sorularınız için info@enrigio.com adresine yazabilirsiniz.\", \"cls\": \"\"}]}]}, \"privacy\": {\"title\": \"Gizlilik\", \"date\": \"10 Kasım 2026\", \"sections\": [{\"h\": \"1. Gizli Bilgi’nin Tanımı\", \"ps\": [{\"t\": \"Sözleşmeye konu olan ve taraflar arasında tesis edilen gizlilik ilkesi kapsamında; birbirlerinden doğrudan veya dolaylı, yazılı veya sözlü, görsel, manyetik veya herhangi başka bir ortamda bulunan ve Taraflardan birinin kendisi, işçileri, acentaları ya da çalışanlarınca diğer tarafın işçileri, acentaları ya da çalışanlarına açıklanan “Gizli Bilgi” olarak tanımlanacak bilgiler;\", \"cls\": \"\"}, {\"t\": \"a) her türlü fikir, buluş, iş, metod,\", \"cls\": \"li\"}, {\"t\": \"b) patent, know-how, telif hakkı, marka, ticari sır\", \"cls\": \"li\"}, {\"t\": \"c) yasal korumaya konu olan ya da olmayan her türlü yenilik\", \"cls\": \"li\"}, {\"t\": \"d) tarafların arasındaki kurmaya niyetlendikleri ve/veya kurulan ticari ilişki ve iş girişimleri kapsamında öğrenecekleri yazılı veya sözlü tüm ticari, mali, teknik bilgiler, hukuki yazılı veya sözlü bilgiler, abonelik ve konuşma bilgileri\", \"cls\": \"li\"}, {\"t\": \"e) ilerlemeye yönelik sair projeler,\", \"cls\": \"li\"}, {\"t\": \"f) her bir tarafın gizli bilgi olarak nitelendirdiği yazılı ve sözlü tüm ticari bilgiler,\", \"cls\": \"li\"}, {\"t\": \"g) kendisinin yazdığı, bulduğu, geliştirdiği, yapmayı veya uygulamaya döktüğü veri tabanı, bilgisayar programları ve bunların dokümanları, şifreleme teknikleri, prosesler, reklam, ambalajlama ve pazarlama planları, ürün planları, teknik planlar, iş stratejileri, stratejik ittifaklar ve ortaklara ilişkin bilgiler, mühendislik verileri, personel bilgileri, ürün tasarımları, şartnameler, teklifler, veriler, grafikler, formüller, süreçler, dizaynlar, planlar, örnekler, raporlar, finansal bilgiler, müşteri bilgileri, satış bilgileri, pazarlama bilgileri, üretim bilgileri, ticari bilgiler, tanımlar, bilgisayar programları, tasarımlar, analizler, şifreler, teknikler, kavramlar, sistemler, deneysel çalışmalar gizli bilgi olarak kabul edilir.\", \"cls\": \"li\"}, {\"t\": \"h) Bunlarla sınırlı olmama koşulu ile birbirlerinin müdürleri, personeli, temsilcisi veya mali ve hukuk danışmanı tarafından hazırlanan ve söz konusu bilgileri içeren, yansıtan veya onlardan sağlanan tüm belgeler ve diğer bilgiler dâhildir.\", \"cls\": \"li\"}, {\"t\": \"Yukarıda Gizli Bilgi olarak tanımlanan konuların koruma mükellefiyeti ifşa eden tarafın kendisi, işçileri, acentaları ya da çalışanlarınca diğer tarafın işçileri, acentaları ya da çalışanlarına açıklanan bilgileri de kapsar.\", \"cls\": \"\"}]}, {\"h\": \"2. Gizli Bilgi’nin Korunması\", \"ps\": [{\"t\": \"Taraflar karşılıklı olarak işbu Sözleşme çerçevesinde diğer taraftan herhangi bir şekilde temin edecekleri Gizli Bilgi’leri;\", \"cls\": \"\"}, {\"t\": \"• devamlı olarak gizli tutacaklarını, saklayacaklarını, koruyacaklarını,\", \"cls\": \"li\"}, {\"t\": \"• doğrudan ya da dolaylı olarak aralarındaki ticari ilişkinin amaçları dışında kullanmayacaklarını,\", \"cls\": \"li\"}, {\"t\": \"• diğer tarafın yazılı rızası olmaksızın üçüncü şahıslara açıklamayacaklarını ve vermeyeceklerini,\", \"cls\": \"li\"}, {\"t\": \"gayrikabili rücu olarak peşinen beyan ve taahhüt etmektedirler.\", \"cls\": \"\"}, {\"t\": \"Taraflar Gizli Bilgi’yi elektronik ortamda paylaşmama, gerektiğinde gösterme fakat bir kopyasını vermeme hakkına sahiptir.\", \"cls\": \"\"}, {\"t\": \"Taraflar kendi Gizli Bilgi’lerini korumakta gösterdikleri özenin aynısını karşı tarafın Gizli Bilgi’lerini korumakta da göstermeyi kabul ve taahhüt ederler. Taraflar -Kişiye özel olarak verilen gizli bilgiler hariç- ancak zorunlu hallerde ve işi gereği bu bilgiyi öğrenmesi gereken işçilerine ve alt çalışanlarına bu bilgiyi verebilecekleri gibi, bilginin gizliliği hususunda da işçilerini ve alt çalışanlarını uyarırlar. Taraflar çalışanlarının ve alt çalışanlarının işbu Sözleşme yükümlülüklerine aykırı davranmaları halinde doğrudan sorumlu olacaklarını peşinen kabul ve taahhüt ederler.\", \"cls\": \"\"}]}, {\"h\": \"3. Gizli Bilgi Tanımına Girmeyen Bilgiler\", \"ps\": [{\"t\": \"a) Taraflardan birince gizli tutma yükümlülüğü olmaksızın daha önceden edinilen bilgiler,\", \"cls\": \"li\"}, {\"t\": \"b) Taraflardan birinin kusuru söz konusu olmaksızın kamuya mal olmuş bilgiler,\", \"cls\": \"li\"}, {\"t\": \"c) Yürürlükte olan kanun ya da düzenlemeler ya da verilmiş olan bir mahkeme kararı, idari emir gereğince açıklanması gereken bilgiler.\", \"cls\": \"li\"}, {\"t\": \"Taraflardan her biri Gizli Bilgi’lerinin ve bu bilgilerdeki haklarının kendi mülkiyetinde olduğunu ve bu bilgilerin ifşa edilmesinin ifşa eden tarafa herhangi bir hak vermeyeceğini kabul eder. Yine her bir taraf, diğerinin Gizli Bilgi’sinin değerli ticari sırları içerdiğini ve karşı tarafa ticari sırlarını vermek gibi bir yükümlülüğü olmadığını kabul eder. Taraflardan hiçbiri Gizli Bilgisi’nin tamlığı, doğruluğu, kesinliği hakkında bir garanti veremez.\", \"cls\": \"\"}]}, {\"h\": \"4. Önlemler\", \"ps\": [{\"t\": \"Eğer taraflardan biri diğerinin Gizli Bilgi’si hakkında yetkisiz bir ifşanın varlığına yol açtığından haberdar olursa karşı tarafı derhal ve yazılı olarak bu yetkisiz ifşa hakkında bilgilendirir ve karşı tarafın bu sebeple maruz kalacağı zararları azaltmak için elinden gelen tüm gayreti gösterir. Mağdur olan taraf gerek kendiliğinden, gerekse karşı tarafın bildirimi üzerine bu ifşanın varlığını öğrenmesinden itibaren ve masrafları ifşa edene ait olmak kaydıyla kanunlarda belirtilen tüm yollara başvurabileceği gibi, maruz kaldığı her türlü zarar ve ziyanın tazminini de talep edebilir. İfşa eden taraf karşı tarafın bu sebeple maruz kaldığı tüm zarar ve ziyanı karşılamayı peşinen kabul ve taahhüt eder.\", \"cls\": \"\"}, {\"t\": \"Firma her durumda bu sözleşmeye aykırı davranışlar için KURUM tarafından hesaplanacak olan diğer zararın tazminini de ayrıca ödemeyi taahhüt eder.\", \"cls\": \"\"}, {\"t\": \"Taraflar, bir diğerinin Gizli Bilgi’si hakkında istemeden ifşa durumuna düşmenin engellenmesi, kurumsal kimlik ve gizliliğin korunması için her Çalışan’a özel olarak Şirket’in açmış olduğu eposta adresleri aracılığıyla yazışmalarını gerçekleştirmeyi kabul ve taahhüt eder.\", \"cls\": \"\"}]}, {\"h\": \"5. Gizli Bilgi’nin İadesi\", \"ps\": [{\"t\": \"Tüm Gizli Bilgiler taraflar arasındaki ticari ilişkinin ya da Sözleşme’nin sona ermesi halinde ve karşı tarafın yazılı ihtarı üzerine derhal bu bilgilerin ait olduğu tarafa iade edilir. Taraflar arasında bu hususta ileride doğacak iş ilişkileri müzakere edilip uygulanacak ayrı bir sözleşmenin konusunu oluşturur.\", \"cls\": \"\"}, {\"t\": \"İade edilen her türlü bilginin, kopyalandığı, çoğaltıldığının tespiti durumunda 5. Maddede belirtilen cezai müeyyide uygulanır.\", \"cls\": \"\"}]}, {\"h\": \"6. İfşaya İzin Verilmesi\", \"ps\": [{\"t\": \"Yükümlülüklerin devamı: Çalışanın işten ayrılmasından sonra bile, gizli bilgilerin korunması yükümlülüğü devam eder.\", \"cls\": \"\"}, {\"t\": \"Taraflardan hiçbiri, kanunda açıkça belirtilen haller dışında Gizli Bilgi’yi herhangi bir şekilde ya da herhangi bir yolla dağıtamaz, basın yayın organları ve medya kuruluşları vasıtasıyla açıklayamaz, reklam amacıyla kullanamaz ve ifşa edemez. Ayrıca görsel ya da yazılı medya aracılığıyla referans olarak gösteremez ya da reklam aracı olarak kullanamaz.\", \"cls\": \"\"}, {\"t\": \"Yukarıda ifade edilen sır saklama yükümlülüklerinin tek istisnası 3. madde ile tespit edilen haller ile karşı tarafın yazılı izni ile söz konusu bilgilerin açıklanmasıdır.\", \"cls\": \"\"}]}, {\"h\": \"7. Devir ve Süre\", \"ps\": [{\"t\": \"Tarafların gizlilik yükümlülükleri, aralarındaki iş ilişkisinin devamı müddetince ve bu ilişkinin herhangi bir nedenle sona ermesini takiben 10 (on) yıl süre ile yürürlükte kalmaya devam edecektir. Bu Sözleşme ya da buradaki herhangi bir hak tamamen ya da kısmen devir konusu olamaz.\", \"cls\": \"\"}]}, {\"h\": \"8. Uygulanacak Hukuk ve Yetkili Mahkeme\", \"ps\": [{\"t\": \"Bu Sözleşme’nin yorumunda ve işbu Sözleşme sebebiyle ortaya çıkacak olan tüm uyuşmazlıklarda İstanbul mahkemeleri ve icra daireleri yetkili olup, Türk hukuku uygulanır. Davalarda, Şirket defter ve kayıtlarının yegane delil teşkil edeceği, muhatabın Şirket aleyhine yemin teklif edemeyeceği esası geçerlidir.\", \"cls\": \"\"}]}, {\"h\": \"9. Kopyalar\", \"ps\": [{\"t\": \"İşbu Sözleşme iki orijinal kopya olarak tanzim edilmiştir. Taraflar kendi nüshalarına ilişkin damga vergisinden mesuldürler.\", \"cls\": \"\"}]}, {\"h\": \"10. Geçerlilik\", \"ps\": [{\"t\": \"İşbu Sözleşme maddelerinden herhangi biri geçersiz sayılır ya da iptal edilir veya uygulanmazsa, bu hal Sözleşme’nin diğer maddelerinin geçerliğine etki etmez.\", \"cls\": \"\"}]}, {\"h\": \"11. Sözleşme Değişikliği\", \"ps\": [{\"t\": \"Bu Sözleşme tarafların gerçek niyetlerini yansıtıp, daha önce bu hususta yapılmış olan yazılı ve sözlü tüm anlaşmaların yerine geçer. Taraflarca yazılı olarak yapılmayan ve her iki tarafça da imzalanmayan hiçbir değişiklik hüküm ifade etmez.\", \"cls\": \"\"}]}, {\"h\": \"12. İhtarlar\", \"ps\": [{\"t\": \"Taraflar, aralarında Sözleşme gereğince yapılacak olan tüm bildirimlerin yazılı olması gerektiğini, ayrıca, aksi yazılı olarak bildirilmedikçe yukarıda yazılı adreslerinin kanuni tebligat adresleri olduğunu beyan ile bu adreslere yapılacak yazılı bildirimlerin kanunen geçerli tebligatın bütün hukuki sonuçlarını doğuracağını kabul etmişlerdir.\", \"cls\": \"\"}]}]}, \"terms\": {\"title\": \"Kullanım koşulları\", \"date\": \"10 Kasım 2026\", \"sections\": [{\"h\": \"1. Taraflar ve kapsam\", \"ps\": [{\"t\": \"Bu Kullanım Koşulları, Enrigio web sitesini ve Enrigio hizmetlerini (“Hizmet”) kullanan kişi ve kurumlar (“Kullanıcı”) ile Hizmet’i sunan şirket (“Şirket”) arasındaki ilişkiyi düzenler. Siteyi ziyaret ederek, erken erişim listesine katılarak ya da Hizmet’i kullanarak bu koşulları kabul etmiş sayılırsınız. Koşulları kabul etmiyorsanız lütfen Hizmet’i kullanmayın.\", \"cls\": \"\"}]}, {\"h\": \"2. Hizmetin tanımı\", \"ps\": [{\"t\": \"Enrigio, markaların ChatGPT, Gemini, Claude ve Perplexity gibi yapay zekâ asistanlarının cevaplarında ne sıklıkla ve hangi bağlamda anıldığını ölçen, sonuçları bir görünürlük skoruna çeviren ve iyileştirme için aksiyon önerileri sunan bir yazılım hizmetidir.\", \"cls\": \"\"}, {\"t\": \"Ölçümler, ilgili yapay zekâ servislerinin ölçüm anındaki cevaplarına dayanır. Bu servisler Şirket’in kontrolünde değildir; cevapları zaman içinde değişebilir. Bu nedenle Şirket, belirli bir skor, sıralama ya da sonuç elde edileceğini garanti etmez.\", \"cls\": \"\"}]}, {\"h\": \"3. Erken erişim\", \"ps\": [{\"t\": \"Hizmet şu anda açılış öncesi erken erişim aşamasındadır. Erken erişim listesine katılmak, Hizmet’in belirli bir tarihte veya belirli özelliklerle sunulacağı anlamına gelmez. Erken erişim döneminde Hizmet’in kapsamı, özellikleri ve fiyatları değişebilir; Şirket bu değişiklikleri Kullanıcı’ya makul sürede duyurur.\", \"cls\": \"\"}]}, {\"h\": \"4. Hesap ve güvenlik\", \"ps\": [{\"t\": \"Hizmet’in bazı bölümlerini kullanmak için hesap oluşturmanız gerekebilir. Hesap oluştururken verdiğiniz bilgilerin doğru ve güncel olmasından, hesap bilgilerinizin gizliliğinden ve hesabınız üzerinden yapılan işlemlerden siz sorumlusunuz. Hesabınızın yetkisiz kullanıldığını fark ederseniz info@enrigio.com adresinden bize derhal haber verin.\", \"cls\": \"\"}]}, {\"h\": \"5. Kullanım kuralları\", \"ps\": [{\"t\": \"Hizmet’i kullanırken aşağıdakileri yapmamayı kabul edersiniz:\", \"cls\": \"\"}, {\"t\": \"• Hizmet’i yürürlükteki mevzuata, üçüncü kişilerin haklarına veya bu koşullara aykırı amaçlarla kullanmak,\", \"cls\": \"li\"}, {\"t\": \"• Hizmet’e, sunuculara veya diğer kullanıcıların verilerine yetkisiz erişim sağlamaya çalışmak, Hizmet’in işleyişini bozacak işlemler yapmak,\", \"cls\": \"li\"}, {\"t\": \"• Hizmet’i veya içerdiği yazılımı kopyalamak, tersine mühendislik yapmak, otomatik araçlarla izinsiz veri toplamak,\", \"cls\": \"li\"}, {\"t\": \"• Sahibi olmadığınız ya da yetkili olmadığınız markalar adına ölçüm başlatmak veya sonuçları yanıltıcı biçimde kullanmak.\", \"cls\": \"li\"}, {\"t\": \"Şirket, bu kurallara aykırı kullanım tespit ettiğinde hesabı askıya alma veya kapatma hakkını saklı tutar.\", \"cls\": \"\"}]}, {\"h\": \"6. Ücretlendirme ve iptal\", \"ps\": [{\"t\": \"Ücretsiz plan ve ücretli planların kapsamı ile fiyatları sitede ilan edilir. Ücretli planlar, aksi belirtilmedikçe aylık olarak peşin faturalandırılır ve Kullanıcı iptal edene kadar her dönem başında yenilenir. Kullanıcı, planını dilediği zaman iptal edebilir; iptal, içinde bulunulan fatura döneminin sonunda geçerli olur. Kısmi dönemler için ücret iadesi yapılmaz, ancak yürürlükteki tüketici mevzuatından doğan haklar saklıdır.\", \"cls\": \"\"}]}, {\"h\": \"7. Fikrî mülkiyet\", \"ps\": [{\"t\": \"Sitede ve Hizmet’te yer alan yazılım, tasarım, metin, logo, görsel ve diğer tüm içeriklerin fikrî mülkiyet hakları Şirket’e veya lisans verenlerine aittir. Bu koşullar Kullanıcı’ya, Hizmet’i yalnızca kendi iç işleri için kullanma amacıyla sınırlı, devredilemez ve münhasır olmayan bir kullanım hakkı tanır.\", \"cls\": \"\"}, {\"t\": \"Kullanıcı’nın Hizmet’e girdiği marka adı, site adresi gibi bilgiler ve kendisi için üretilen raporlar Kullanıcı’ya aittir. Şirket bu bilgileri Hizmet’i sunmak ve geliştirmek amacıyla, kimliği belirlenemeyecek şekilde toplu istatistiklere dönüştürerek kullanabilir.\", \"cls\": \"\"}]}, {\"h\": \"8. Kişisel veriler\", \"ps\": [{\"t\": \"Kişisel verileriniz, 6698 sayılı Kişisel Verilerin Korunması Kanunu’na uygun olarak işlenir. Hangi verilerin hangi amaçlarla işlendiğine ve haklarınıza ilişkin ayrıntılar KVKK Bildirimi sayfamızda yer alır.\", \"cls\": \"\"}]}, {\"h\": \"9. Sorumluluğun sınırlandırılması\", \"ps\": [{\"t\": \"Hizmet “olduğu gibi” sunulur. Şirket, Hizmet’in kesintisiz veya hatasız çalışacağını ya da önerilen aksiyonların belirli bir ticari sonuç doğuracağını garanti etmez. Yürürlükteki mevzuatın izin verdiği ölçüde Şirket, dolaylı zararlardan, kâr veya müşteri kaybından sorumlu tutulamaz. Şirket’in bu koşullar kapsamındaki toplam sorumluluğu, zarara yol açan olaydan önceki 12 ay içinde Kullanıcı’nın Şirket’e ödediği toplam ücretle sınırlıdır.\", \"cls\": \"\"}]}, {\"h\": \"10. Üçüncü taraf hizmetler\", \"ps\": [{\"t\": \"Hizmet, ölçüm yapmak için üçüncü taraflara ait yapay zekâ servislerini kullanır ve sitede üçüncü taraf sitelere bağlantılar bulunabilir. Bu servislerin ve sitelerin içeriğinden, erişilebilirliğinden ve kendi kullanım koşullarından Şirket sorumlu değildir.\", \"cls\": \"\"}]}, {\"h\": \"11. Hizmetin askıya alınması ve sona ermesi\", \"ps\": [{\"t\": \"Kullanıcı, hesabını dilediği zaman kapatabilir. Şirket, bu koşulların ihlali, yasal bir zorunluluk ya da Hizmet’in güvenliğini tehdit eden bir durum halinde Hizmet’i askıya alabilir veya sona erdirebilir. Sona erme halinde, ödenmiş ücretlere ilişkin hükümler ve doğası gereği devam etmesi gereken hükümler yürürlükte kalır.\", \"cls\": \"\"}]}, {\"h\": \"12. Değişiklikler\", \"ps\": [{\"t\": \"Şirket bu Kullanım Koşulları’nı zaman zaman güncelleyebilir. Güncel metin bu sayfada yayımlanır ve sayfanın başındaki “Son güncelleme” tarihi değiştirilir. Önemli değişiklikler kayıtlı Kullanıcılara e-posta ile ayrıca bildirilir. Değişiklikten sonra Hizmet’i kullanmaya devam etmek, güncel koşulların kabul edildiği anlamına gelir.\", \"cls\": \"\"}]}, {\"h\": \"13. Uygulanacak hukuk ve yetkili mahkeme\", \"ps\": [{\"t\": \"Bu koşullar Türkiye Cumhuriyeti hukukuna tabidir. Bu koşullardan doğan uyuşmazlıklarda, tüketicilerin kanundan doğan hakları saklı kalmak kaydıyla, İstanbul mahkemeleri ve icra daireleri yetkilidir.\", \"cls\": \"\"}]}, {\"h\": \"14. İletişim\", \"ps\": [{\"t\": \"Bu koşullarla ilgili sorularınız için info@enrigio.com adresine yazabilir veya +90 (850) 777 74 46 numaralı telefondan bize ulaşabilirsiniz. Adres: Ünalan Mah. Ünalan Cad. Medeniyet Teknopark No:1/12 İstanbul.\", \"cls\": \"\"}]}]}};\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { site: '', email: '', siteErr: '', emailErr: '', cf: { name: '', email: '', company: '', phone: '', scope: '', note: '' }, cErr: {}, screen: 'landing', tab: 0, done: false, contactDone: false, eng: 0, spin: 0, chars: 0, phase: 0 }; }\n  componentDidMount() { this.run(); }\n  componentWillUnmount() { clearTimeout(this.t); }\n  toTop() {\n    var top = function () {\n      try { window.scrollTo(0, 0); } catch (e) {}\n      try { if (document.scrollingElement) document.scrollingElement.scrollTop = 0; document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } catch (e) {}\n    };\n    top();\n    try { requestAnimationFrame(function () { top(); requestAnimationFrame(top); }); } catch (e) {}\n    setTimeout(top, 60); setTimeout(top, 200);\n  }\n  goTo(patch) { this.setState(patch); this.toTop(); }\n  componentDidUpdate(pp, ps) {\n    if (ps && ps.screen !== this.state.screen) { this.toTop(); if (this.state.screen === 'landing') this.run(); else clearTimeout(this.t); }\n  }\n  run() {\n    var self = this;\n    clearTimeout(this.t);\n    var reduce = false;\n    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}\n    if (reduce) { this.setState({ chars: 999, phase: 6 }); return; }\n    var tick = function () {\n      var s = self.state, q = ENGINES[s.eng].q;\n      if (s.chars < q.length) { self.setState({ chars: s.chars + 1 }); self.t = setTimeout(tick, 26 + Math.random() * 30); return; }\n      if (s.phase < 6) { self.setState({ phase: s.phase + 1 }); self.t = setTimeout(tick, s.phase === 0 ? 350 : 520); return; }\n      self.t = setTimeout(function () {\n        self.setState({ eng: (s.eng + 1) % ENGINES.length, spin: s.spin + 1, chars: 0, phase: 0 });\n        self.t = setTimeout(tick, 600);\n      }, 2400);\n    };\n    this.setState({ chars: 0, phase: 0 });\n    this.t = setTimeout(tick, 800);\n  }\n  renderVals() {\n    var self = this, s = this.state, cur = ENGINES[s.eng];\n    var go = function (e) { if (e && e.preventDefault) e.preventDefault(); self.goTo({ screen: 'signup', done: false }); };\n    var engines = ENGINES.map(function (x, i) {\n      return { name: x.name, logo: x.logo, pill: i === s.eng ? 'eng-pill eng-pill--on' : 'eng-pill', pressed: i === s.eng ? 'true' : 'false',\n        pick: function () { if (i === s.eng) return; var sp = s.spin + 1; while (sp % ENGINES.length !== i) sp++; self.setState({ eng: i, spin: sp, chars: 0, phase: 0 }); self.run(); },\n        word: 'w-' + x.name.toLowerCase() + (i === s.eng ? ' on' : ''), faceT: 'rotateX(' + (i * 90) + 'deg) translateZ(0.48em)' };\n    });\n    var items = cur.items.map(function (x, i) { return { n: i + 1, b: x.b, d: x.d, cls: s.phase >= i + 2 ? 'a-item on' : 'a-item' }; });\n    var tabs = SECTORS.map(function (x, i) {\n      return { label: x.label, tabId: 'n2-tab-' + i, sel: i === s.tab ? 'true' : 'false', cls: i === s.tab ? 'tab tab--on' : 'tab', pick: function () { self.setState({ tab: i }); } };\n    });\n    var sec = SECTORS[s.tab];\n    var site = s.site.trim().replace(/^https?:\\/\\//, '');\n    return {\n      isLanding: s.screen === 'landing', isSignup: s.screen === 'signup', isContact: s.screen === 'contact', isInfo: s.screen === 'info',\n      isLegal: s.screen === 'privacy' || s.screen === 'terms' || s.screen === 'kvkk',\n      legal: s.screen === 'terms' ? LEGAL.terms : (s.screen === 'kvkk' ? LEGAL.kvkk : LEGAL.privacy),\n      goKvkk: function (e) { if (e && e.preventDefault) e.preventDefault(); self.goTo({ screen: 'kvkk' }); },\n      goPrivacy: function (e) { if (e && e.preventDefault) e.preventDefault(); self.goTo({ screen: 'privacy' }); },\n      goTerms: function (e) { if (e && e.preventDefault) e.preventDefault(); self.goTo({ screen: 'terms' }); },\n      goInfo: function (e) { if (e && e.preventDefault) e.preventDefault(); self.goTo({ screen: 'info' }); },\n      contactDone: s.contactDone, contactNotDone: !s.contactDone,\n      goContact: function (e) { if (e && e.preventDefault) e.preventDefault(); self.goTo({ screen: 'contact', contactDone: false }); },\n      cf: s.cf, cErr: s.cErr,\n      cSet: (function () { var o = {}; ['name', 'email', 'company', 'phone', 'scope', 'note'].forEach(function (k) { o[k] = function (e) { var cf = Object.assign({}, self.state.cf); cf[k] = e.target.value; var ce = Object.assign({}, self.state.cErr); delete ce[k]; self.setState({ cf: cf, cErr: ce }); }; }); return o; })(),\n      submitContact: function (e) {\n        if (e && e.preventDefault) e.preventDefault();\n        var f = self.state.cf, err = {};\n        var v = function (k) { return (f[k] || '').trim(); };\n        if (!v('name')) err.name = 'Adınızı ve soyadınızı yazın.'; else if (v('name').split(/\\s+/).length < 2) err.name = 'Ad ve soyadınızı birlikte yazın.';\n        if (!v('email')) err.email = 'İş e-postanızı yazın.'; else if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(v('email'))) err.email = 'E-posta adresi eksik görünüyor, örneğin ad@sirketiniz.com';\n        if (!v('company')) err.company = 'Şirket adını yazın.';\n        var digits = v('phone').replace(/\\D/g, '');\n        if (!v('phone')) err.phone = 'Telefon numaranızı yazın.'; else if (digits.length < 10 || digits.length > 13) err.phone = 'Geçerli bir telefon yazın, örneğin +90 5xx xxx xx xx';\n        if (!v('scope')) err.scope = 'Kaç marka veya site izlemek istediğinizi yazın.';\n        if (!v('note')) err.note = 'Kısaca ihtiyacınızı yazın; teklifi buna göre hazırlıyoruz.'; else if (v('note').length < 15) err.note = 'Biraz daha ayrıntı verin (en az 15 karakter).';\n        if (Object.keys(err).length) { self.setState({ cErr: err }); return; }\n        self.setState({ contactDone: true, cErr: {} });\n      },\n      engines: engines, cur: cur, items: items,\n      prismT: 'translateZ(-0.48em) rotateX(' + (-s.spin * 90) + 'deg)',\n      qTyped: cur.q.slice(0, s.chars),\n      siteShown: site || 'siteniz.com',\n      cls: { intro: s.phase >= 1 ? 'a-intro on' : 'a-intro', miss: s.phase >= 5 ? 'a-miss on' : 'a-miss', score: s.phase >= 6 ? 'a-score on' : 'a-score' },\n      ringOff: s.phase >= 6 ? (CIRC * (1 - cur.score / 100)).toFixed(1) : CIRC,\n      qRow1: QS1.concat(QS1, QS1, QS1), qRow2: QS2.concat(QS2, QS2, QS2),\n      tabs: tabs, sec: { tabId: 'n2-tab-' + s.tab, q: sec.q, intro: sec.intro, items: sec.items.map(function (x, i) { return { n: i + 1, b: x.b, d: x.d }; }) },\n      site: s.site, hasSite: site.length > 0,\n      onSite: function (e) { self.setState({ site: e.target.value, siteErr: '' }); },\n      email: s.email, siteErr: s.siteErr, emailErr: s.emailErr,\n      onEmail: function (e) { self.setState({ email: e.target.value, emailErr: '' }); },\n      go: go,\n      back: function (e) { if (e && e.preventDefault) e.preventDefault(); self.goTo({ screen: 'landing' }); },\n      submitSignup: function (e) {\n        if (e && e.preventDefault) e.preventDefault();\n        var st = (self.state.site || '').trim().replace(/^https?:\\/\\//i, '').replace(/\\/.*$/, '');\n        var em = (self.state.email || '').trim();\n        var siteErr = !st ? 'Site adresinizi yazın.' : (!/^([a-z0-9\\u00e7\\u011f\\u0131\\u00f6\\u015f\\u00fc-]+\\.)+[a-z]{2,}$/i.test(st) ? 'Geçerli bir site adresi yazın, örneğin siteniz.com' : '');\n        var emailErr = !em ? 'İş e-postanızı yazın.' : (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(em) ? 'E-posta adresi eksik görünüyor, örneğin ad@sirketiniz.com' : '');\n        if (siteErr || emailErr) { self.setState({ siteErr: siteErr, emailErr: emailErr }); return; }\n        self.setState({ done: true, siteErr: '', emailErr: '', site: st });\n      },\n      done: s.done, notDone: !s.done,\n      doneLine: 'Açıldığımız gün ' + (site || 'siteniz') + ' için ilk görünürlük skorunuzu çıkarıp e-posta ile göndereceğiz.',\n      logoH: 32, footLogoH: 28, markH: 24, yes: true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
